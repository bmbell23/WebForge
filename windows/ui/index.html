<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* #7: theme tokens — chrome follows the OS light/dark setting. */
  :root {
    color-scheme: light dark;
    --bg: #dde3ec;          /* chrome background */
    --surface: #cbd4e2;     /* nav bar */
    --tab: #cfd7e3;         /* inactive tab */
    --tab-active: #f6f8fb;  /* active tab */
    --text: #1a2b4c;
    --text-dim: #5a6b88;
    --hover: rgba(0, 0, 0, 0.08);
    --field-bg: #ffffff;
    --field-text: #111111;
    --accent: #2f6fd0;
    --disabled: #9aa8bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10203c;
      --surface: #1a2b4c;
      --tab: #182a4a;
      --tab-active: #2c4370;
      --text: #e3eaf5;
      --text-dim: #9fb0c9;
      --hover: rgba(255, 255, 255, 0.12);
      --field-bg: #0d1830;
      --field-text: #e3eaf5;
      --accent: #7fb2ff;
      --disabled: #6b7c99;
    }
  }
  * { box-sizing: border-box; }
  /* #8: full-window chrome — left sidebar spans the height, nav bar tops the
     content column; the rest is covered by the content WebContentsView.
     Keep the 240px / 44px in sync with SIDEBAR_W / TOPBAR_H in main.js. */
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 44px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px system-ui, sans-serif;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* --- vertical tab sidebar --- */
  #sidebar {
    grid-column: 1;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-height: 0;
  }
  #sidebar header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 6px 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  #newtab {
    width: 26px; height: 26px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  #newtab:hover { background: var(--hover); }
  #tablist {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    padding: 0 6px 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tab {
    flex: 0 0 auto;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px 0 10px;
    border-radius: 6px;
    background: var(--tab);
    color: var(--text-dim);
    cursor: default;
    white-space: nowrap;
  }
  .tab.active { background: var(--tab-active); color: var(--text); }
  .tab .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab .close {
    width: 18px; height: 18px;
    border: none; border-radius: 50%;
    background: transparent; color: inherit;
    font-size: 12px; line-height: 1;
    cursor: pointer;
    visibility: hidden;
  }
  .tab:hover .close { visibility: visible; }
  .tab .close:hover { background: var(--hover); }
  .tab .spinner { font-size: 11px; }

  /* --- nav bar --- */
  #nav {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: var(--surface);
  }
  #nav button {
    width: 30px; height: 30px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text);
    font-size: 16px; cursor: pointer;
  }
  #nav button:hover:not(:disabled) { background: var(--hover); }
  #nav button:disabled { color: var(--disabled); cursor: default; }
  #url {
    flex: 1; height: 30px;
    border: none; border-radius: 15px;
    padding: 0 14px;
    background: var(--field-bg); color: var(--field-text);
    font-size: 13px; outline: none;
  }

  /* --- load progress (indeterminate), pinned to the nav bar's bottom --- */
  #progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    overflow: hidden;
  }
  #progress.loading::after {
    content: '';
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: var(--accent);
    animation: slide 1s linear infinite;
  }
  @keyframes slide {
    to { left: 100%; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <header>
      <span>WebForge</span>
      <button id="newtab" title="New tab (Ctrl+T)">+</button>
    </header>
    <div id="tablist"></div>
  </div>
  <div id="nav">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reloadstop" title="Reload">⟳</button>
    <input id="url" type="text" spellcheck="false"
           placeholder="Search or enter address">
    <div id="progress"></div>
  </div>
<script>
  const tablist = document.getElementById('tablist');
  const url = document.getElementById('url');
  const back = document.getElementById('back');
  const forward = document.getElementById('forward');
  const reloadstop = document.getElementById('reloadstop');
  const progress = document.getElementById('progress');
  let activeLoading = false;

  document.getElementById('newtab').onclick = () => webforge.newTab();
  back.onclick = () => webforge.goBack();
  forward.onclick = () => webforge.goForward();
  reloadstop.onclick = () => (activeLoading ? webforge.stop() : webforge.reload());
  url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { webforge.navigate(url.value); url.blur(); }
  });
  url.addEventListener('focus', () => url.select());
  webforge.onFocusUrl(() => { url.focus(); url.select(); });

  function makeTab(t) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.active ? ' active' : '');
    el.title = t.url;

    if (t.loading) {
      const spin = document.createElement('span');
      spin.className = 'spinner';
      spin.textContent = '⟳';
      el.appendChild(spin);
    }
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.title;
    el.appendChild(title);

    const close = document.createElement('button');
    close.className = 'close';
    close.textContent = '✕';
    close.title = 'Close tab';
    close.onclick = (e) => { e.stopPropagation(); webforge.closeTab(t.id); };
    el.appendChild(close);

    el.onclick = () => webforge.activateTab(t.id);
    el.onauxclick = (e) => { if (e.button === 1) webforge.closeTab(t.id); };
    return el;
  }

  webforge.onTabsUpdated((state) => {
    tablist.replaceChildren(...state.map(makeTab));
    const active = state.find((t) => t.active);
    if (!active) return;
    if (document.activeElement !== url) url.value = active.url;
    back.disabled = !active.canGoBack;
    forward.disabled = !active.canGoForward;
    activeLoading = active.loading;
    reloadstop.textContent = activeLoading ? '✕' : '⟳';
    reloadstop.title = activeLoading ? 'Stop' : 'Reload';
    progress.className = activeLoading ? 'loading' : '';
  });
</script>
</body>
</html>
