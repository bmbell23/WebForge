<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* #7: theme tokens — chrome follows the OS light/dark setting. */
  :root {
    color-scheme: light dark;
    --bg: #dde3ec;          /* chrome background */
    --surface: #cbd4e2;     /* nav bar */
    --tab: #cfd7e3;         /* inactive tab */
    --tab-active: #f6f8fb;  /* active tab */
    --text: #1a2b4c;
    --text-dim: #5a6b88;
    --hover: rgba(0, 0, 0, 0.08);
    --field-bg: #ffffff;
    --field-text: #111111;
    --accent: #2f6fd0;
    --disabled: #9aa8bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10203c;
      --surface: #1a2b4c;
      --tab: #182a4a;
      --tab-active: #2c4370;
      --text: #e3eaf5;
      --text-dim: #9fb0c9;
      --hover: rgba(255, 255, 255, 0.12);
      --field-bg: #0d1830;
      --field-text: #e3eaf5;
      --accent: #7fb2ff;
      --disabled: #6b7c99;
    }
  }
  * { box-sizing: border-box; }
  /* #8: full-window chrome — left sidebar spans the height, nav bar tops the
     content column; the rest is covered by the content WebContentsView.
     Keep the 240px / 44px in sync with SIDEBAR_W / TOPBAR_H in main.js. */
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 44px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px system-ui, sans-serif;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* --- vertical tab sidebar --- */
  #sidebar {
    grid-column: 1;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-height: 0;
  }
  #sidebar header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 6px 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  #newtab {
    width: 26px; height: 26px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text-dim);
    font-size: 16px; cursor: pointer;
  }
  #newtab:hover { background: var(--hover); }
  #tablist {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    padding: 0 6px 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tab {
    flex: 0 0 auto;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px 0 10px;
    border-radius: 6px;
    background: var(--tab);
    color: var(--text-dim);
    cursor: default;
    white-space: nowrap;
  }
  .tab.active { background: var(--tab-active); color: var(--text); }
  .tab .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab .close {
    width: 18px; height: 18px;
    border: none; border-radius: 50%;
    background: transparent; color: inherit;
    font-size: 12px; line-height: 1;
    cursor: pointer;
    visibility: hidden;
  }
  .tab:hover .close { visibility: visible; }
  .tab .close:hover { background: var(--hover); }
  .tab .spinner { font-size: 11px; }
  .tab .pin { font-size: 10px; }
  .tab.pinned .close { display: none; } /* #9: unpin to close */
  /* #16: hotkey group */
  .grouphdr {
    padding: 8px 6px 3px;
    font-size: 10px; font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .kbd {
    flex: 0 0 auto;
    min-width: 16px; height: 16px;
    padding: 0 3px;
    border-radius: 4px;
    background: var(--accent); color: var(--tab-active);
    font: 700 10px ui-monospace, monospace;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .bm .setkey {
    width: 20px; height: 18px;
    border: none; border-radius: 4px;
    background: transparent; color: inherit;
    font-size: 11px; cursor: pointer;
    visibility: hidden;
  }
  .bm:hover .setkey { visibility: visible; }
  .bm .setkey:hover { background: var(--hover); }

  /* --- nav bar --- */
  #nav {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: var(--surface);
  }
  #nav button {
    width: 30px; height: 30px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text);
    font-size: 16px; cursor: pointer;
  }
  #nav button:hover:not(:disabled) { background: var(--hover); }
  #nav button:disabled { color: var(--disabled); cursor: default; }
  #url {
    flex: 1; height: 30px;
    border: none; border-radius: 15px;
    padding: 0 14px;
    background: var(--field-bg); color: var(--field-text);
    font-size: 13px; outline: none;
  }

  /* --- right-side panels: bookmarks (#11) and passwords (#26) --- */
  #bmpanel, #pwpanel {
    position: absolute;
    top: 44px; right: 0; bottom: 0;
    width: 280px;
    display: none;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--hover);
    z-index: 5;
  }
  #bmpanel.open, #pwpanel.open { display: flex; }
  #pwpanel header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    font-weight: 600;
    color: var(--text-dim);
  }
  #pwlist { flex: 1; overflow-y: auto; scrollbar-width: thin; padding: 0 6px 10px; }
  #pwadd {
    width: 26px; height: 26px;
    border: none; border-radius: 6px;
    background: var(--surface); color: var(--text);
    font-size: 14px; cursor: pointer;
  }
  #pwadd:hover { background: var(--hover); }
  .credpw { font: 11px ui-monospace, monospace; color: var(--text-dim); }
  .credform {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px; margin: 4px 0;
    background: var(--tab); border-radius: 8px;
  }
  .credform input {
    height: 28px; border: none; border-radius: 6px;
    padding: 0 10px;
    background: var(--field-bg); color: var(--field-text);
    font-size: 12px; outline: none;
  }
  .credform .btnrow { display: flex; gap: 6px; }
  .credform .btnrow button {
    flex: 1; height: 26px;
    border: none; border-radius: 6px;
    background: var(--accent); color: #fff;
    font-size: 12px; cursor: pointer;
  }
  .credform .btnrow button.cancel { background: var(--surface); color: var(--text); }
  /* #27: bookmark search */
  #bmsearch {
    margin: 0 8px 6px; height: 26px;
    border: none; border-radius: 13px;
    padding: 0 12px;
    background: var(--field-bg); color: var(--field-text);
    font-size: 12px; outline: none;
  }
  #bmpanel header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    font-weight: 600;
    color: var(--text-dim);
  }
  #bmimport, #pwimport {
    border: none; border-radius: 6px;
    padding: 4px 10px;
    background: var(--surface); color: var(--text);
    font-size: 12px; cursor: pointer;
  }
  #bmimport:hover, #pwimport:hover { background: var(--hover); }
  #bmlist { flex: 1; overflow-y: auto; scrollbar-width: thin; padding: 0 6px 10px; }
  .bmfolder {
    padding: 8px 6px 3px;
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bm {
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 4px 0 8px;
    border-radius: 6px;
    color: var(--text);
    cursor: default; white-space: nowrap;
  }
  .bm:hover { background: var(--hover); }
  .bm .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .bm .rm {
    width: 18px; height: 18px;
    border: none; border-radius: 50%;
    background: transparent; color: inherit;
    font-size: 11px; cursor: pointer;
    visibility: hidden;
  }
  .bm:hover .rm { visibility: visible; }
  .bm .rm:hover { background: var(--hover); }
  #bmempty { padding: 14px 12px; color: var(--text-dim); }

  /* --- #14 fullscreen hover-reveal: the chrome view is resized by main to
     exactly one panel's region, and body[data-fs] shows only that panel --- */
  body[data-fs] { display: block; }
  body[data-fs] > * { display: none !important; }
  body[data-fs="tabs"] #sidebar { display: flex !important; width: 100%; height: 100vh; }
  body[data-fs="nav"] #nav { display: flex !important; }
  body[data-fs="bookmarks"] #bmpanel {
    display: flex !important;
    position: static;
    width: 100%; height: 100vh;
    border-left: none;
  }

  /* --- load progress (indeterminate), pinned to the nav bar's bottom --- */
  #progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    overflow: hidden;
  }
  #progress.loading::after {
    content: '';
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: var(--accent);
    animation: slide 1s linear infinite;
  }
  @keyframes slide {
    to { left: 100%; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <header>
      <span>WebForge</span>
      <button id="newtab" title="New tab (Ctrl+T)">+</button>
    </header>
    <div id="tablist"></div>
  </div>
  <div id="nav">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reloadstop" title="Reload">⟳</button>
    <input id="url" type="text" spellcheck="false"
           placeholder="Search or enter address">
    <button id="star" title="Bookmark this page (Ctrl+D)">☆</button>
    <button id="bmtoggle" title="Bookmarks (Ctrl+B)">📚</button>
    <button id="pwtoggle" title="Passwords (Ctrl+Shift+K)">🔐</button>
    <div id="progress"></div>
  </div>
  <div id="bmpanel">
    <header>
      <span id="bmcount">Bookmarks</span>
      <span>
        <button id="pwimport" title="Import passwords (Firefox about:logins CSV export)">🔑</button>
        <button id="bmimport" title="Import a Firefox bookmarks export">Import…</button>
      </span>
    </header>
    <input id="bmsearch" type="text" placeholder="Search bookmarks" spellcheck="false">
    <div id="bmlist"></div>
  </div>
  <div id="pwpanel">
    <header>
      <span id="pwcount">Passwords</span>
      <button id="pwadd" title="Add a login">＋</button>
    </header>
    <div id="pwlist"></div>
  </div>
<script>
  const tablist = document.getElementById('tablist');
  const url = document.getElementById('url');
  const back = document.getElementById('back');
  const forward = document.getElementById('forward');
  const reloadstop = document.getElementById('reloadstop');
  const progress = document.getElementById('progress');
  let activeLoading = false;

  document.getElementById('newtab').onclick = () => webforge.newTab();
  back.onclick = () => webforge.goBack();
  forward.onclick = () => webforge.goForward();
  reloadstop.onclick = () => (activeLoading ? webforge.stop() : webforge.reload());
  url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { webforge.navigate(url.value); url.blur(); }
  });
  url.addEventListener('focus', () => url.select());
  webforge.onFocusUrl(() => { url.focus(); url.select(); });

  function makeTab(t) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.active ? ' active' : '') + (t.pinned ? ' pinned' : '');
    el.title = t.url;

    if (t.hotkey) {
      const k = document.createElement('span');
      k.className = 'kbd';
      k.textContent = t.hotkey;
      el.appendChild(k);
    }
    if (t.pinned) {
      const pin = document.createElement('span');
      pin.className = 'pin';
      pin.textContent = '📌';
      el.appendChild(pin);
    }
    if (t.loading) {
      const spin = document.createElement('span');
      spin.className = 'spinner';
      spin.textContent = '⟳';
      el.appendChild(spin);
    }
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.title;
    el.appendChild(title);

    const close = document.createElement('button');
    close.className = 'close';
    close.textContent = '✕';
    close.title = 'Close tab';
    close.onclick = (e) => { e.stopPropagation(); webforge.closeTab(t.id); };
    el.appendChild(close);

    el.onclick = () => webforge.activateTab(t.id);
    el.onauxclick = (e) => { if (e.button === 1) webforge.closeTab(t.id); };
    el.oncontextmenu = (e) => { e.preventDefault(); webforge.togglePin(t.id); };
    return el;
  }

  function groupHdr(label) {
    const h = document.createElement('div');
    h.className = 'grouphdr';
    h.textContent = label;
    return h;
  }

  webforge.onTabsUpdated((state) => {
    // #16: sidebar sections — Hotkeys, Pinned, then normal tabs.
    const hot = state.filter((t) => t.hotkey);
    const pin = state.filter((t) => !t.hotkey && t.pinned);
    const rest = state.filter((t) => !t.hotkey && !t.pinned);
    const nodes = [];
    if (hot.length) nodes.push(groupHdr('Hotkeys'), ...hot.map(makeTab));
    if (pin.length) nodes.push(groupHdr('Pinned'), ...pin.map(makeTab));
    if (rest.length) {
      if (nodes.length) nodes.push(groupHdr('Tabs'));
      nodes.push(...rest.map(makeTab));
    }
    tablist.replaceChildren(...nodes);
    const active = state.find((t) => t.active);
    if (!active) return;
    if (document.activeElement !== url) url.value = active.url;
    back.disabled = !active.canGoBack;
    forward.disabled = !active.canGoForward;
    activeLoading = active.loading;
    reloadstop.textContent = activeLoading ? '✕' : '⟳';
    reloadstop.title = activeLoading ? 'Stop' : 'Reload';
    progress.className = activeLoading ? 'loading' : '';
    star.textContent = active.starred ? '★' : '☆';
  });

  // --- bookmarks (#11) ---
  const star = document.getElementById('star');
  const bmpanel = document.getElementById('bmpanel');
  const bmlist = document.getElementById('bmlist');
  const bmcount = document.getElementById('bmcount');

  star.onclick = () => webforge.toggleStar();
  document.getElementById('bmtoggle').onclick = () => webforge.toggleBookmarksPanel();
  document.getElementById('pwimport').onclick = () => webforge.importPasswords();

  // --- passwords panel (#26) ---
  const pwpanel = document.getElementById('pwpanel');
  const pwlist = document.getElementById('pwlist');
  const pwcount = document.getElementById('pwcount');
  let credsList = [];
  let pwEditing = null; // credential id, or 'new'

  document.getElementById('pwtoggle').onclick = () => webforge.togglePwPanel();
  document.getElementById('pwadd').onclick = () => { pwEditing = 'new'; renderCreds(); };
  webforge.onPwPanel((open) => { pwpanel.classList.toggle('open', open); if (!open) pwEditing = null; });
  webforge.onCredsUpdated((list) => { credsList = list || []; pwEditing = null; renderCreds(); });

  function credForm(c) {
    const f = document.createElement('div');
    f.className = 'credform';
    const mk = (ph, val, type = 'text') =>
      Object.assign(document.createElement('input'), { placeholder: ph, value: val || '', type, spellcheck: false });
    const fOrigin = mk('https://site.com', c.origin);
    const fUser = mk('username', c.username);
    const fPass = mk('password', c.password);
    f.append(fOrigin, fUser, fPass);
    const row = document.createElement('div');
    row.className = 'btnrow';
    const save = Object.assign(document.createElement('button'), { textContent: 'Save' });
    save.onclick = async () => {
      const ok = await webforge.saveCred({ id: c.id, origin: fOrigin.value, username: fUser.value, password: fPass.value });
      if (!ok) pwcount.textContent = 'Save failed — origin must be a URL, password required';
    };
    const cancel = Object.assign(document.createElement('button'), { textContent: 'Cancel', className: 'cancel' });
    cancel.onclick = () => { pwEditing = null; renderCreds(); };
    row.append(save, cancel);
    f.appendChild(row);
    return f;
  }

  function renderCreds() {
    pwcount.textContent = `Passwords (${credsList.length})`;
    const nodes = [];
    if (pwEditing === 'new') nodes.push(credForm({}));
    for (const c of credsList) {
      if (pwEditing === c.id) { nodes.push(credForm(c)); continue; }
      const el = document.createElement('div');
      el.className = 'bm';
      el.title = c.origin;
      const t = document.createElement('span');
      t.className = 'title';
      t.textContent = `${c.origin.replace(/^https?:\/\//, '')} — ${c.username || '(no user)'}`;
      el.appendChild(t);
      const pw = document.createElement('span');
      pw.className = 'credpw';
      el.appendChild(pw);
      const eye = Object.assign(document.createElement('button'), { className: 'rm', textContent: '👁', title: 'Show password' });
      eye.onclick = (e) => { e.stopPropagation(); pw.textContent = pw.textContent ? '' : c.password; };
      el.appendChild(eye);
      const rm = Object.assign(document.createElement('button'), { className: 'rm', textContent: '✕', title: 'Delete login' });
      rm.onclick = (e) => { e.stopPropagation(); webforge.deleteCred(c.id); };
      el.appendChild(rm);
      el.onclick = () => { pwEditing = c.id; renderCreds(); };
      nodes.push(el);
    }
    if (!nodes.length) {
      nodes.push(Object.assign(document.createElement('div'), {
        id: 'bmempty',
        textContent: 'No saved logins. Import a Firefox CSV (🔑 in Bookmarks) or add one with ＋.',
      }));
    }
    pwlist.replaceChildren(...nodes);
  }

  // --- bookmark search (#27) ---
  const bmsearch = document.getElementById('bmsearch');
  bmsearch.addEventListener('input', () => renderBookmarks(lastBookmarks));
  document.getElementById('bmimport').onclick = async () => {
    const r = await webforge.importBookmarks();
    if (!r) return;
    bmcount.textContent = r.error
      ? `Import failed: ${r.error}`
      : `Imported ${r.added} (${r.skipped} dupes skipped)`;
  };

  webforge.onBookmarksPanel((open) => bmpanel.classList.toggle('open', open));
  webforge.onFsMode((mode) => { // #14
    if (mode) document.body.dataset.fs = mode;
    else delete document.body.dataset.fs;
  });

  // --- #16: hotkeys — chrome-side firing, bookmark ⌨ assignment ---
  let hotkeysMap = {}; // keyId -> {url, title}
  let lastBookmarks = [];
  let capture = null;  // {url, title} while waiting for a key press
  const keyIdOf = (e) => (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + e.key;
  const keyForUrl = (url) => Object.keys(hotkeysMap).find((k) => hotkeysMap[k].url === url);

  window.addEventListener('keydown', (e) => {
    if (capture) {
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Escape') {
        capture = null;
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        const k = keyForUrl(capture.url);
        if (k) webforge.removeHotkey(k);
        capture = null;
      } else if (e.key.length === 1 && !e.metaKey) {
        webforge.setHotkey(keyIdOf(e), capture.url, capture.title);
        capture = null;
      }
      if (!capture) bmcount.textContent = `Bookmarks (${lastBookmarks.length})`;
      return;
    }
    // Fire hotkeys when chrome has focus too (sidebar/panel clicks focus us).
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.repeat || e.metaKey || e.key.length !== 1) return;
    const id = keyIdOf(e);
    if (hotkeysMap[id]) {
      e.preventDefault();
      webforge.sendKey(id);
    }
  }, true);

  webforge.onHotkeysUpdated((map) => {
    hotkeysMap = map || {};
    renderBookmarks(lastBookmarks); // refresh key badges
  });

  webforge.onBookmarksUpdated((list) => {
    lastBookmarks = list;
    renderBookmarks(list);
  });

  function renderBookmarks(fullList) {
    // #27: live search over title/url/folder.
    const q = (document.getElementById('bmsearch')?.value || '').trim().toLowerCase();
    const list = q
      ? fullList.filter((b) =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.url || '').toLowerCase().includes(q) ||
          (b.folder || '').toLowerCase().includes(q))
      : fullList;
    bmcount.textContent = q
      ? `Bookmarks (${list.length}/${fullList.length})`
      : `Bookmarks (${fullList.length})`;
    if (!list.length) {
      bmlist.replaceChildren(
        Object.assign(document.createElement('div'), {
          id: 'bmempty',
          textContent: 'No bookmarks yet. Star a page (Ctrl+D) or Import a Firefox export.',
        })
      );
      return;
    }
    const byFolder = new Map();
    for (const b of list) {
      const key = b.folder || 'Other';
      if (!byFolder.has(key)) byFolder.set(key, []);
      byFolder.get(key).push(b);
    }
    const nodes = [];
    for (const [folder, items] of [...byFolder.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      const h = document.createElement('div');
      h.className = 'bmfolder';
      h.textContent = folder;
      h.title = folder;
      nodes.push(h);
      for (const b of items) {
        const el = document.createElement('div');
        el.className = 'bm';
        el.title = b.url;
        const bound = keyForUrl(b.url);
        if (bound) {
          const k = document.createElement('span');
          k.className = 'kbd';
          k.textContent = bound;
          el.appendChild(k);
        }
        const t = document.createElement('span');
        t.className = 'title';
        t.textContent = b.title;
        el.appendChild(t);
        const setkey = document.createElement('button');
        setkey.className = 'setkey';
        setkey.textContent = '⌨';
        setkey.title = bound
          ? `Hotkey: ${bound} — press a new key, Del to unbind, Esc to cancel`
          : 'Set a hotkey for this bookmark';
        setkey.onclick = (e) => {
          e.stopPropagation();
          capture = { url: b.url, title: b.title };
          bmcount.textContent = `Press a key for "${b.title}" (Del unbinds, Esc cancels)`;
        };
        el.appendChild(setkey);
        const rm = document.createElement('button');
        rm.className = 'rm';
        rm.textContent = '✕';
        rm.title = 'Remove bookmark';
        rm.onclick = (e) => { e.stopPropagation(); webforge.removeBookmark(b.id); };
        el.appendChild(rm);
        el.onclick = () => webforge.openBookmark(b.url, false);
        el.onauxclick = (e) => { if (e.button === 1) webforge.openBookmark(b.url, true); };
        nodes.push(el);
      }
    }
    bmlist.replaceChildren(...nodes);
  }
</script>
</body>
</html>
