<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>About WebForge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f4; --card: #ffffff; --text: #1c1c1e; --dim: #6e6e73;
    --hover: rgba(0,0,0,0.07); --accent: #2f7cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #131315; --text: #e8e8ea; --dim: #7c7c82;
      --hover: rgba(255,255,255,0.09); --accent: #3d9bff;
    }
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body {
    margin: 0; padding: 32px 24px 60px;
    background: var(--bg); color: var(--text);
    font: 14px system-ui, sans-serif;
  }
  .inner { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .tagline { color: var(--dim); margin-bottom: 22px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); margin: 30px 0 10px;
  }
  .badge {
    display: inline-block; padding: 2px 8px; margin-left: 8px;
    border-radius: 10px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--hover); color: var(--dim); vertical-align: middle;
  }
  .badge.win { background: #2f7cf6; color: #fff; }
  .badge.and { background: #3aa85a; color: #fff; }
  .item {
    background: var(--card); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .item .l { font-weight: 600; margin-bottom: 3px; }
  .item .v { }
  .item .n { color: var(--dim); font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--hover); }
  td:first-child { width: 240px; color: var(--dim); font: 600 12px ui-monospace, monospace; }
  td.v { font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<div class="inner">
  <h1>WebForge</h1>
  <div class="tagline" id="tagline">A personal browser for Windows and Android.</div>
  <div id="live"></div>
  <div id="content"></div>
</div>
<script>
  const BADGE = { common: '', windows: 'win', android: 'and' };
  const LABEL = { common: 'Both platforms', windows: 'Windows', android: 'Android' };

  function item(it) {
    const box = document.createElement('div');
    box.className = 'item';
    box.appendChild(Object.assign(document.createElement('div'), { className: 'l', textContent: it.label }));
    box.appendChild(Object.assign(document.createElement('div'), { className: 'v', textContent: it.value }));
    if (it.note) {
      box.appendChild(Object.assign(document.createElement('div'), { className: 'n', textContent: it.note }));
    }
    return box;
  }

  function heading(section) {
    const h = document.createElement('h2');
    h.textContent = section.title;
    const b = document.createElement('span');
    b.className = 'badge ' + BADGE[section.platform];
    b.textContent = LABEL[section.platform] || section.platform;
    h.appendChild(b);
    return h;
  }

  (async () => {
    const info = await wf.about();
    document.getElementById('tagline').textContent =
      `Version ${info.version} · a personal browser for Windows and Android`;

    // Live, measured on THIS machine — never hardcoded.
    const live = document.getElementById('live');
    live.appendChild(Object.assign(document.createElement('h2'), { textContent: 'This build, right now' }));
    const t = document.createElement('table');
    for (const [k, v] of Object.entries(info.runtime)) {
      const tr = document.createElement('tr');
      tr.appendChild(Object.assign(document.createElement('td'), { textContent: k }));
      tr.appendChild(Object.assign(document.createElement('td'), { className: 'v', textContent: v }));
      t.appendChild(tr);
    }
    live.appendChild(t);

    const content = document.getElementById('content');
    for (const section of info.sections) {
      content.appendChild(heading(section));
      for (const it of section.items) content.appendChild(item(it));
    }
  })();
</script>
</body>
</html>
