<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New terminal</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
  #term { position: absolute; inset: 6px; }
  /* #214: the new-tab picker — a terminal tab opened without a host. */
  #picker { position: absolute; inset: 0; display: none; overflow: auto; padding: 32px 48px; color: #ddd;
            font: 14px 'Segoe UI', system-ui, sans-serif; background: #0c0c0c; }
  body.picking #picker { display: block; }
  body.picking #term { visibility: hidden; }
  #picker h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  #picker h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #888; margin: 20px 0 6px; }
  #target { width: 360px; max-width: 100%; padding: 8px 10px; font: 14px 'Cascadia Mono', Consolas, monospace;
            background: #1a1a1a; color: #eee; border: 1px solid #444; border-radius: 4px; }
  .host { display: flex; align-items: center; gap: 8px; max-width: 480px; }
  .host button.go { flex: 1; text-align: left; padding: 6px 10px; font: 14px 'Cascadia Mono', Consolas, monospace;
                    background: #161616; color: #ddd; border: 1px solid #2a2a2a; border-radius: 4px; cursor: pointer; }
  .host button.go:hover, .host button.go:focus { background: #23324a; border-color: #3d6bb3; outline: none; }
  .host button.star { background: none; border: none; color: #c9a227; font-size: 16px; cursor: pointer; }
  .empty { color: #666; }
  /* #228: the inline Favorite editor */
  .host button.edit { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; }
  .host button.edit:hover { color: #ddd; }
  .hostedit { display: flex; flex-direction: column; gap: 4px; max-width: 480px; margin: 4px 0; }
  .hostedit input { padding: 6px 10px; font: 14px 'Cascadia Mono', Consolas, monospace;
                    background: #1a1a1a; color: #eee; border: 1px solid #444; border-radius: 4px; }
  .hostedit .btns { display: flex; gap: 8px; }
  .hostedit .err { color: #e5534b; font-size: 12px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="picker">
  <h1>Open a terminal</h1>
  <input id="target" type="text" placeholder="user@host, host:port, or an ~/.ssh/config name" spellcheck="false" autocomplete="off">
  <div id="groups"></div>
</div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script>
  // #206: spike terminal. Keys, mouse and colour are xterm.js defaults; the
  // only options are the font, the theme and the kitty keyboard protocol that
  // forge's Ctrl+Space needs (@xterm/xterm 6.1 betas only).
  const term = new Terminal({
    fontFamily: "'Cascadia Mono', Consolas, monospace",
    fontSize: 14,
    cursorBlink: true,
    theme: { background: '#0c0c0c' },
    vtExtensions: { kittyKeyboard: true },
    // OSC 8 hyperlinks (the Claude CLI prints these) open as WebForge tabs.
    linkHandler: { activate: (_e, uri) => window.terminal.openLink(uri), allowNonHttpProtocols: false },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // Plain URLs in the output, too.
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => window.terminal.openLink(uri)));
  term.open(document.getElementById('term'));
  // #216: GPU renderer; any failure falls back silently to the default DOM renderer.
  try {
    const gl = new WebglAddon.WebglAddon();
    gl.onContextLoss(() => gl.dispose());
    term.loadAddon(gl);
  } catch (_) {}
  fit.fit();

  // OSC 52 set only; main decodes, caps and ignores "?" and bad base64.
  // #212: Windows Terminal's habits. Ctrl+V / Ctrl+Shift+V paste, Ctrl+Shift+C
  // copies the selection, right click copies a selection or else pastes. Right
  // click is caught before xterm, so forge's mouse capture never sees it.
  // term.paste() wraps in bracketed paste when the app asked for it.
  window.terminal.onPasteText((text) => { if (text) term.paste(text); });
  const copySelection = () => {
    const sel = term.getSelection();
    if (!sel) return false;
    window.terminal.copyText(sel);
    term.clearSelection();
    return true;
  };
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown' || !e.ctrlKey || e.altKey || e.metaKey) return true;
    if (e.code === 'KeyV') { e.preventDefault(); window.terminal.paste(); return false; }
    if (e.code === 'KeyC' && e.shiftKey) { e.preventDefault(); copySelection(); return false; }
    return true;
  });
  const host = document.getElementById('term');
  host.addEventListener('mousedown', (e) => {
    if (e.button !== 2) return;
    e.preventDefault();
    e.stopPropagation();
    if (!copySelection()) window.terminal.paste();
  }, true);
  host.addEventListener('mouseup', (e) => { if (e.button === 2) { e.preventDefault(); e.stopPropagation(); } }, true);
  host.addEventListener('contextmenu', (e) => e.preventDefault(), true);

  term.parser.registerOscHandler(52, (data) => {
    window.terminal.copy(data);
    return true;
  });

  const COLORS = { info: '36', warn: '33', error: '31;1' };
  window.terminal.onData((buf) => term.write(buf));
  window.terminal.onStatus(({ kind, text }) => {
    term.write(`\r\n\x1b[${COLORS[kind] || '0'}m${text}\x1b[0m\r\n`);
  });
  term.onData((d) => window.terminal.write(d));
  term.onResize(({ cols, rows }) => window.terminal.resize(cols, rows));
  window.addEventListener('resize', () => fit.fit());

  // #214: a session needs a host to start. ?host= comes from a connection the
  // user clicked; without it, this tab is the picker until one is chosen.
  window.terminal.onPrompt((q) => term.write(`\r\n\x1b[33;1m${q}\x1b[0m`));
  const begin = (target) => {
    document.body.classList.remove('picking');
    document.title = target.startsWith('local:') ? target.slice(6) : target; // #276
    fit.fit();
    window.terminal.start(term.cols, term.rows, target);
    term.focus();
  };
  const hostParam = new URLSearchParams(location.search).get('host');
  if (hostParam) {
    begin(hostParam);
  } else {
    document.body.classList.add('picking');
    const input = document.getElementById('target');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) begin(input.value.trim());
    });
    // #228: user@host:port as parts (same rules as termhosts.splitTarget).
    const splitTarget = (t) => {
      const m = /^(?:([^@]+)@)?(\[[^\]]*\]|[^:]+)(?::(\d+))?$/.exec(t);
      return m ? { user: m[1] || '', host: m[2].replace(/^\[(.*)\]$/, '$1'), port: m[3] || '' } : { user: '', host: t, port: '' };
    };
    // #228: swaps a Favorite's row for Name / User / Host / Port. Enter saves, Esc cancels.
    const editRow = (t, label, row) => {
      const p = splitTarget(t);
      const form = Object.assign(document.createElement('div'), { className: 'hostedit' });
      form.onclick = (e) => e.stopPropagation();
      const field = (placeholder, value) => Object.assign(document.createElement('input'), {
        type: 'text', placeholder, value, spellcheck: false,
      });
      const fName = field('Name (optional)', label === t ? '' : label);
      const fUser = field('User', p.user);
      const fHost = field('Host or IP', p.host);
      const fPort = field('Port (optional)', p.port);
      const err = Object.assign(document.createElement('div'), { className: 'err' });
      const save = async () => {
        const r = await window.terminal.editFavorite(t, { name: fName.value, user: fUser.value, host: fHost.value, port: fPort.value });
        if (r && r.ok) render();
        else err.textContent = (r && r.error) || 'Could not save.';
      };
      const saveBtn = Object.assign(document.createElement('button'), { textContent: 'Save' });
      const cancelBtn = Object.assign(document.createElement('button'), { textContent: 'Cancel' });
      saveBtn.onclick = save;
      cancelBtn.onclick = () => render();
      const btns = Object.assign(document.createElement('div'), { className: 'btns' });
      btns.append(saveBtn, cancelBtn);
      form.onkeydown = (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); save(); }
        else if (e.key === 'Escape') { e.preventDefault(); render(); }
      };
      form.append(fName, fUser, fHost, fPort, err, btns);
      row.replaceWith(form);
      fName.focus();
    };
    const render = async () => {
      const g = (await window.terminal.connections()) || { favorites: [], frequent: [], config: [], names: {} };
      const names = g.names || {};
      const groups = document.getElementById('groups');
      groups.replaceChildren();
      // #276: this PC's shells come first; no star, edit or remove.
      if (g.local && g.local.length) {
        groups.appendChild(Object.assign(document.createElement('h2'), { textContent: 'This PC' }));
        for (const l of g.local) {
          const row = Object.assign(document.createElement('div'), { className: 'host' });
          const go = Object.assign(document.createElement('button'), { className: 'go', textContent: l.label, title: `Open ${l.label} on this computer` });
          go.onclick = () => begin(l.target);
          row.appendChild(go);
          groups.appendChild(row);
        }
      }
      for (const [title, list, fav] of [['★ Favorites', g.favorites, true], ['Frequent', g.frequent, false], ['~/.ssh/config', g.config, false]]) {
        const h = document.createElement('h2');
        h.textContent = title;
        groups.appendChild(h);
        if (!list.length) {
          groups.appendChild(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'none yet' }));
          continue;
        }
        for (const t of list) {
          const row = document.createElement('div');
          row.className = 'host';
          const label = (fav && names[t]) || t;
          const go = Object.assign(document.createElement('button'), { className: 'go', textContent: label, title: t });
          go.onclick = () => begin(t);
          const star = Object.assign(document.createElement('button'), {
            className: 'star', textContent: fav ? '★' : '☆', title: fav ? 'Remove from Favorites' : 'Add to Favorites',
          });
          star.onclick = () => { window.terminal.favorite(t); setTimeout(render, 50); };
          // #241: every row can be edited; a non-Favorite becomes one when saved.
          const ed = Object.assign(document.createElement('button'), {
            className: 'edit', textContent: '✎', title: fav ? 'Edit this favorite' : 'Edit (saves it as a Favorite)',
          });
          ed.onclick = (e) => { e.stopPropagation(); editRow(t, label, row); };
          // #280: remove the row from its group (no confirm(): not implemented here).
          const group = fav ? 'favorites' : list === g.frequent ? 'frequent' : 'config';
          const del = Object.assign(document.createElement('button'), {
            className: 'edit', textContent: '✕',
            title: fav ? 'Remove from Favorites' : group === 'frequent' ? 'Forget this host' : 'Hide this ssh-config host',
          });
          del.onclick = async (e) => { e.stopPropagation(); await window.terminal.deleteConnection(t, group); render(); };
          row.append(go, ed, star, del);
          groups.appendChild(row);
        }
      }
    };
    render();
    input.focus();
  }
</script>
</body>
</html>
