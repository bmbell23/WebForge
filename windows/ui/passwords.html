<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Saved logins</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f4; --card: #ffffff; --text: #1c1c1e; --dim: #6e6e73;
    --hover: rgba(0,0,0,0.07); --field: #ffffff; --field-text: #111;
    --accent: #2f7cf6; --danger: #a13030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #131315; --text: #e8e8ea; --dim: #7c7c82;
      --hover: rgba(255,255,255,0.09); --field: #131315; --field-text: #e8e8ea;
      --accent: #3d9bff; --danger: #c04040;
    }
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body {
    margin: 0; padding: 32px 24px 60px;
    background: var(--bg); color: var(--text);
    font: 14px system-ui, sans-serif;
  }
  .inner { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar button {
    height: 32px; border: none; border-radius: 8px; font-size: 13px; outline: none;
  }
  #filter { flex: 1; min-width: 160px; padding: 0 12px; background: var(--field); color: var(--field-text); }
  .toolbar button { padding: 0 14px; background: var(--card); color: var(--text); cursor: pointer; }
  .toolbar button:hover { background: var(--hover); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--hover); font-size: 13px;
  }
  .row:hover { background: var(--hover); }
  .row .site { min-width: 240px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .user { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pw { font: 12px ui-monospace, monospace; color: var(--dim); min-width: 110px; }
  .row input {
    height: 28px; border: none; border-radius: 6px; padding: 0 8px;
    background: var(--field); color: var(--field-text); font-size: 12px; outline: none;
  }
  .row button {
    width: 28px; height: 28px; border: none; border-radius: 6px;
    background: transparent; color: var(--text); cursor: pointer;
  }
  .row button:hover { background: var(--hover); }
  .addrow { display: flex; gap: 8px; margin-top: 16px; }
  .addrow input {
    height: 32px; border: none; border-radius: 8px; padding: 0 12px;
    background: var(--field); color: var(--field-text); font-size: 13px; outline: none;
  }
  .addrow button {
    height: 32px; padding: 0 18px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .empty { color: var(--dim); padding: 20px 4px; }
</style>
</head>
<body>
<div class="inner">
  <h1>Saved logins</h1>
  <div class="sub" id="sub">Stored in the encrypted vault — readable only while WebForge is unlocked.</div>
  <div class="toolbar">
    <input id="filter" type="text" placeholder="Search by site or username" spellcheck="false">
    <button id="import">Import Firefox CSV…</button>
  </div>
  <div id="list"></div>
  <div class="addrow">
    <input id="cOrigin" type="text" placeholder="https://site.com" spellcheck="false" style="flex:1">
    <input id="cUser" type="text" placeholder="username" spellcheck="false" style="width:180px">
    <input id="cPass" type="password" placeholder="password" style="width:160px">
    <button id="cAdd">Add</button>
  </div>
</div>
<script>
  let creds = [];
  let editing = null;
  const list = document.getElementById('list');
  const sub = document.getElementById('sub');

  async function load() { creds = await wf.getCreds(); render(); }

  function render() {
    const q = document.getElementById('filter').value.trim().toLowerCase();
    const shown = q
      ? creds.filter((c) =>
          c.origin.toLowerCase().includes(q) || (c.username || '').toLowerCase().includes(q))
      : creds;
    if (!shown.length) {
      list.replaceChildren(Object.assign(document.createElement('div'), {
        className: 'empty',
        textContent: creds.length
          ? 'No logins match.'
          : 'No saved logins yet. Import a Firefox CSV above, or add one below.',
      }));
      return;
    }
    list.replaceChildren(...shown.map((c) => {
      const row = document.createElement('div');
      row.className = 'row';
      if (editing === c.id) {
        const user = Object.assign(document.createElement('input'), { value: c.username || '', placeholder: 'username' });
        const pass = Object.assign(document.createElement('input'), { value: c.password || '', placeholder: 'password' });
        user.style.flex = '1'; pass.style.flex = '1';
        row.append(Object.assign(document.createElement('span'), { className: 'site', textContent: c.origin }), user, pass);
        const ok = Object.assign(document.createElement('button'), { textContent: '✔', title: 'Save' });
        ok.onclick = async () => {
          await wf.saveCred({ id: c.id, origin: c.origin, username: user.value, password: pass.value });
          editing = null; load();
        };
        const no = Object.assign(document.createElement('button'), { textContent: '✕', title: 'Cancel' });
        no.onclick = () => { editing = null; render(); };
        row.append(ok, no);
        for (const f of [user, pass]) {
          f.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ok.onclick();
            if (e.key === 'Escape') no.onclick();
          });
        }
        return row;
      }
      const pw = Object.assign(document.createElement('span'), { className: 'pw', textContent: '••••••••' });
      row.append(
        Object.assign(document.createElement('span'), {
          className: 'site', textContent: c.origin.replace(/^https?:\/\//, ''), title: c.origin,
        }),
        Object.assign(document.createElement('span'), { className: 'user', textContent: c.username || '(no username)' }),
        pw
      );
      const eye = Object.assign(document.createElement('button'), { textContent: '👁', title: 'Show password' });
      eye.onclick = () => { pw.textContent = pw.textContent === '••••••••' ? c.password : '••••••••'; };
      const ed = Object.assign(document.createElement('button'), { textContent: '✎', title: 'Edit' });
      ed.onclick = () => { editing = c.id; render(); };
      const del = Object.assign(document.createElement('button'), { textContent: '🗑', title: 'Delete' });
      del.onclick = async () => { await wf.deleteCred(c.id); load(); };
      row.append(eye, ed, del);
      return row;
    }));
  }

  document.getElementById('filter').addEventListener('input', render);
  document.getElementById('import').onclick = () => {
    wf.importPasswords();
    setTimeout(load, 1500); // the file dialog + import run in the main process
  };
  document.getElementById('cAdd').onclick = async () => {
    const origin = document.getElementById('cOrigin').value.trim();
    const username = document.getElementById('cUser').value.trim();
    const password = document.getElementById('cPass').value;
    if (!origin || !password) return;
    const ok = await wf.saveCred({ origin, username, password });
    sub.textContent = ok
      ? 'Stored in the encrypted vault — readable only while WebForge is unlocked.'
      : 'Could not save — the site must be a full URL, e.g. https://example.com';
    if (ok) {
      document.getElementById('cOrigin').value = '';
      document.getElementById('cUser').value = '';
      document.getElementById('cPass').value = '';
      load();
    }
  };

  load();
</script>
</body>
</html>
