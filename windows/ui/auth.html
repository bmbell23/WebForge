<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  /* #111: the HTTP Basic/Digest credential dialog Electron does not provide.
     Without it a 401 just rendered the server's "you must log in" page. */
  :root {
    color-scheme: light dark;
    --bg: #f2f2f4; --card: #ffffff; --text: #1c1c1e; --dim: #6e6e73;
    --hover: rgba(0,0,0,0.07); --accent: #2f7cf6; --border: rgba(0,0,0,0.14);
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #131315; --text: #e8e8ea; --dim: #7c7c82;
      --hover: rgba(255,255,255,0.09); --accent: #3d9bff; --border: rgba(255,255,255,0.16);
      --field: #131315;
    }
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body {
    margin: 0; padding: 22px;
    background: var(--bg); color: var(--text);
    font: 13.5px system-ui, sans-serif;
    -webkit-user-select: none;
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .sub { color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-bottom: 16px; word-break: break-all; }
  .realm { color: var(--text); font-weight: 600; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: 0.05em; color: var(--dim); margin: 12px 0 5px; }
  input[type=text], input[type=password] {
    width: 100%; height: 34px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--field); color: var(--text);
    font: 13.5px system-ui, sans-serif; outline: none;
    -webkit-user-select: text;
  }
  input:focus { border-color: var(--accent); }
  .save { display: flex; align-items: center; gap: 7px; margin-top: 14px;
          color: var(--dim); font-size: 12.5px; }
  .row { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
  button {
    border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 16px; font: 500 13px system-ui, sans-serif;
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
  <h1 id="title">Sign in</h1>
  <div class="sub" id="sub"></div>

  <label for="user">Username</label>
  <input id="user" type="text" autocomplete="off" spellcheck="false">

  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="off">

  <div class="save" id="saverow" style="display:none">
    <input type="checkbox" id="save">
    <label for="save" style="margin:0;text-transform:none;letter-spacing:0;font-size:12.5px">
      Save this login to WebForge
    </label>
  </div>

  <div class="row">
    <button id="cancel">Cancel</button>
    <button class="primary" id="ok">Sign in</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  (async () => {
    const d = await wf.authDetails();
    if (!d) {
      $('sub').textContent = 'This sign-in request is no longer active.';
      return;
    }
    const where = d.port && d.port !== 80 && d.port !== 443 ? `${d.host}:${d.port}` : d.host;
    $('title').textContent = d.isProxy ? 'Proxy sign-in required' : 'Sign in';
    $('sub').innerHTML = d.realm
      ? `<span class="realm">${where}</span> is asking for a username and password for <span class="realm">${d.realm}</span>.`
      : `<span class="realm">${where}</span> is asking for a username and password.`;
    if (d.canSave) $('saverow').style.display = 'flex';
    if (d.prefill) {
      $('user').value = d.prefill.username || '';
      $('pass').value = d.prefill.password || '';
    }
    // Land where the user still has to type.
    ($('user').value ? $('pass') : $('user')).focus();
  })();

  const submit = () => wf.authSubmit($('user').value, $('pass').value, $('save').checked);
  $('ok').onclick = submit;
  $('cancel').onclick = () => wf.authCancel();
  // Enter submits from either field; Esc cancels — as any credential dialog should.
  for (const id of ['user', 'pass']) {
    $(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); wf.authCancel(); }
  });
</script>
</body>
</html>
