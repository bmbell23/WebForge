plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Single source of truth for the app version: ../../version.txt at the repo
// root, bumped by `gvc`. versionName mirrors the file; versionCode is derived
// so it monotonically increases as long as semver is followed.
//   1.2.1  ->  10201   (major*10000 + minor*100 + patch)
def versionFile  = file('../../version.txt')
def appSemver    = versionFile.exists() ? versionFile.text.trim() : '0.0.0'
def semverParts  = appSemver.tokenize('.').collect { it.toInteger() }
while (semverParts.size() < 3) { semverParts << 0 }
def appVersionCode = semverParts[0] * 10000 + semverParts[1] * 100 + semverParts[2]

android {
    compileSdk 34
    namespace 'com.webforge.browser'

    defaultConfig {
        applicationId "com.webforge.browser"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appSemver
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        // BuildConfig.VERSION_NAME is what the self-updater compares against
        // the server's version.txt (AGP 8 turns BuildConfig off by default).
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        // #55: com.lambdaworks:scrypt ships JNI builds for macOS/Linux/Windows
        // inside its jar, and AGP was dutifully packaging a .dylib into the APK.
        // Dropping them forces the pure-Java path, which is the only one Android
        // can use anyway — and makes the derivation deterministic across hosts.
        // Note these go under resources, not jniLibs: AGP's jniLibs matcher only
        // claims `**.so`, so a nested `.dylib` falls through to the resource
        // merger and keeps its lib/ path all the way into the APK.
        jniLibs.excludes += ['**/darwin/**', '**/linux/**', '**/windows/**']
        resources.excludes += ['**/*.dylib', '**/*.dll', 'lib/**']
    }
}

dependencies {
    // #55: scrypt. The Android platform ships PBKDF2 but NOT scrypt, and the
    // Windows vault derives its key with scrypt(N=32768, r=8, p=1) — swapping in
    // PBKDF2 would look like "wrong password" forever against an existing vault.
    // Deliberately NOT BouncyCastle: bcprov is ~3MB and took the APK from 0.9MB
    // to 4.1MB for one function, on an app that self-updates over Tailscale.
    // com.lambdaworks:scrypt is the reference Java implementation at ~50KB.
    implementation 'com.lambdaworks:scrypt:1.4.0'

    // #55: VaultCrypto is deliberately free of Android APIs so the
    // Windows-interop proof runs as a plain JVM test (see VaultCryptoTest).
    testImplementation 'junit:junit:4.13.2'
}
