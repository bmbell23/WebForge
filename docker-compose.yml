# WebForge release server — static nginx serving ./releases on :8012
# (port claimed per the .augment-guidelines inventory; 8012 = next after
# chess_app's 8011). Installed apps poll /version.txt and download
# /webforge.apk (Android) — Windows artifacts land here too (#3).
services:
  webforge_releases:
    image: nginx:alpine
    container_name: webforge_releases
    restart: unless-stopped
    ports:
      - "8012:80"
    volumes:
      - ./releases:/usr/share/nginx/html:ro

  # #13: bookmarks sync — tiny stdlib-only LWW JSON store on :8013.
  webforge_sync:
    image: python:3.12-alpine
    container_name: webforge_sync
    restart: unless-stopped
    command: python /app/sync.py
    ports:
      - "8013:8013"
    volumes:
      - ./server:/app:ro
      - ./data:/data
      # #286: agent-bus thread 025, the !define drop folder (only this folder)
      - /home/brandon/projects/agent-bus/data/triggers/webforge:/triggers

  # #315: copies the macOS .dmg/.zip that GitHub Actions builds (#270) into
  # ./releases/mac, so :8012/mac/latest-mac.yml is what the Mac app checks.
  # Polls GitHub every 10 min; runs as brandon so the files aren't root-owned.
  webforge_macmirror:
    image: python:3.12-alpine
    container_name: webforge_macmirror
    restart: unless-stopped
    user: "1000:1000"
    command: python -u /app/mac_mirror.py
    volumes:
      - ./server:/app:ro
      - ./releases:/releases
